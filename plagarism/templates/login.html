<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #e1bee7, #ffccbc); /* Gradient background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0; /* Remove default margin */
        }
        .login-container {
            background: #f3e5f5; /* Very light lavender background */
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 300px;
            text-align: center; /* Center text in the container */
        }
        h2 {
            margin-bottom: 1rem;
            color: #4a148c; /* Dark purple color for the heading */
        }
        form {
            display: flex;
            flex-direction: column; /* Stack form elements vertically */
        }
        input[type="text"],
        input[type="password"] {
            padding: 10px;
            margin: 0.5rem 0; /* Add margin between inputs */
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
        }
        button {
            padding: 10px;
            background-color: #4a148c; /* Dark purple background for button */
            color: white; /* White text color */
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s; /* Smooth transition for hover effect */
            margin-top: 1rem; /* Add margin above the button */
        }
        button:hover {
            background-color: #6a1b9a; /* Lighter purple on hover */
        }
        .actions {
            margin-top: 1rem;
        }
        .actions p {
            margin: 0; /* Remove default margin */
        }
        .actions a {
            color: #ffffff; /* White text color for better visibility */
            text-decoration: none; /* Remove underline from links */
            background-color: #4a148c; /* Dark purple background for register button */
            padding: 10px 15px; /* Add padding for better button appearance */
            border-radius: 4px; /* Rounded corners */
            display: inline-block; /* Make it inline-block for better alignment */
            transition: background-color 0.3s; /* Smooth transition for hover effect */
        }
        .actions a:hover {
            background-color: #6a1b9a; /* Lighter purple on hover */
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Login</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Login</button>
    </form>

    <div class="actions">
        <p>Don't have an account?</p>
        <a href="{% url 'register' %}">Register</a> <!-- Register button -->
    </div>
</div>

</body>
</html>
