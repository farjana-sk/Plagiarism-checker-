<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #e1bee7, #ffccbc);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }
    .register-container {
        background: #f3e5f5;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        width: 400px;
        text-align: center;
    }
    h2 {
        margin-bottom: 1rem;
        color: #4a148c;
    }
    form {
        display: flex;
        flex-direction: column;
    }
    input {
        padding: 10px;
        margin: 0.5rem 0;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 1em;
    }
    button {
        padding: 10px;
        background-color: #1976D2;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 1em;
        transition: background-color 0.3s;
        margin-top: 1rem;
    }
    button:hover {
        background-color: #2196F3;
    }
    .actions {
        margin-top: 1rem;
    }
    .actions p {
        margin: 0;
    }
    .actions a {
        display: inline-block;
        background-color: #1976D2;
        color: white;
        padding: 10px 15px;
        border-radius: 4px;
        text-decoration: none;
        transition: background-color 0.3s;
        margin-top: 1rem;
    }
    .actions a:hover {
        background-color: #2196F3;
    }
    .errorlist {
        color: red;
        list-style: none;
        padding: 0;
        margin: 0;
        font-size: 0.9em;
    }
</style>
</head>
<body>

<div class="register-container">
    <h2>Register</h2>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            {{ field.label_tag }}
            {{ field }}
            {% if field.errors %}
                <ul class="errorlist">
                    {% for error in field.errors %}
                        <li>{{ error }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endfor %}
        <button type="submit">Register</button>
    </form>
    <div class="actions">
        <p>Already have an account?</p>
        <a href="{% url 'login' %}">Login here</a>
    </div>
</div>

</body>
</html>
