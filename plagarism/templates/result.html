<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plagiarism Result</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(to right, #e0eafc, #cfdef3);
    margin: 0;
    padding: 0;
}

.container {
    max-width: 800px;
    margin: 50px auto;
    padding: 40px;
    background: #ffffff;
    border-radius: 15px;
    box-shadow: 0 12px 25px rgba(0, 0, 0, 0.1);
    transition: transform 0.3s, box-shadow 0.3s;
}

.container:hover {
    transform: scale(1.02);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
}

h1 {
    text-align: center;
    color: #2c3e50;
    margin-bottom: 30px;
    font-weight: 600;
    font-size: 2.5em;
    text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
}

.result {
    margin-top: 35px;
    padding: 20px;
    background: #e6f7ff;
    border-left: 6px solid #1890ff;
    border-radius: 8px;
    animation: fadeIn 0.5s ease-in-out;
}

.result h3 {
    color: #333;
    font-size: 1.5em;
}

.result p {
    margin: 8px 0;
    font-size: 15px;
}

.error {
    color: #e74c3c;
    font-weight: bold;
    margin: 20px 0;
    text-align: center;
}

.logout-button {
    background-color: #28a745;
    color: white;
    padding: 12px 25px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.3s, transform 0.2s;
    display: block;
    margin: 20px auto 0;
}

.logout-button:hover {
    background-color: #218838;
    transform: translateY(-2px);
}

a {
    display: inline-block;
    margin-top: 20px;
    text-decoration: none;
    color: #1890ff;
    font-weight: 600;
}

a:hover {
    text-decoration: underline;
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}
</style>
</head>
<body>
<div class="container">
    <h1>Plagiarism Result</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    {% if result %}
    <div class="result">
        <h3>Result Details</h3>
        <p><strong>TF-IDF:</strong> {{ result.tfidf }}</p>
        <p><strong>SBERT:</strong> {{ result.sbert }}</p>
        <p><strong>Hybrid:</strong> {{ result.hybrid }}</p>
        <p><strong>Verdict:</strong> {{ result.verdict }}</p>
    </div>
    {% endif %}

    <a href="{% url 'home' %}">Check Another</a>

    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button class="logout-button">Logout</button>
    </form>
</div>
</body>
</html>
