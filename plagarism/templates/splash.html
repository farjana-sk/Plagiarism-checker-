<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Plagiarism Checker</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #e1bee7; /* Light purple background color */
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            overflow: hidden; /* Prevent overflow */
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
            animation: bounce 1s infinite; /* Add bounce animation */
            color: #4a148c; /* Dark purple text color for contrast */
        }
        p {
            color: #6a1b9a; /* A suitable dark shade of purple for better readability */
            font-size: 1.5em;
            margin-top: 20px; /* Added margin for spacing */
            animation: fadeIn 1s ease-in-out;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-30px); /* Bounce height */
            }
            60% {
                transform: translateY(-15px); /* Bounce height */
            }
        }
    </style>
</head>
<body>
    <meta http-equiv="refresh" content="5;url=/login/">
    <h1>Welcome to Plagiarism Checker</h1>
    <p>Loading…</p>
</body>
</html>
